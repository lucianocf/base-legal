# Local development database. The application runs on the host for now
# (`uv run base-legal ...`); an app image comes with the API in weekend 2.
services:
  db:
    # pgvector/pgvector:pg17, pinned by digest (same as CI)
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: base_legal
      POSTGRES_PASSWORD: base_legal # local-only default; override in .env for anything shared
      POSTGRES_DB: base_legal
    ports:
      - "127.0.0.1:5432:5432" # bind to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base_legal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
