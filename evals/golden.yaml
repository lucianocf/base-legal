# Golden set for Base Legal retrieval and generation evals.
#
# Drafted with AI from docs/golden-set-draft.md; every item is
# `status: unverified` until a DPO reviews it. Questions are synthetic.
# Expected IDs are the minimum set a correct answer must cite, checked to
# exist in the corpus snapshot of 2026-09-27.
#
# `split`: `dev` items may be used to tune retrieval; `holdout` items are
# only used to confirm a change. Stratified and stable: the 30 % of
# answerable items with the lowest sha256(id), and the lowest-hash refusal
# of each reason, are holdout. g43 and g44, the known failures that
# motivated tuning, are always dev.
#
# License: CC BY 4.0 (ADR 0007).
