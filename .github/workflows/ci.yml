name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src tests

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg17, pinned by digest
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: base_legal
          POSTGRES_PASSWORD: base_legal # throwaway CI database, not a secret
          POSTGRES_DB: base_legal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base_legal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://base_legal:base_legal@localhost:5432/base_legal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Unit and integration tests (coverage gate 85 %)
        run: uv run pytest --cov=base_legal --cov-report=term --cov-fail-under=85

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pip-audit on the locked dependency set
        # The export is the complete pinned set (--no-deps). CPU-only torch comes
        # from the PyTorch index as "X.Y.Z+cpu", which PyPI does not know; its
        # advisories are keyed by the upstream version, so audit it as X.Y.Z.
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt \
            | sed -E 's/^(torch==[0-9.]+)\+cpu\b/\1/' > requirements.txt
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
