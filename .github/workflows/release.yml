name: Release

# Runs only when a maintainer pushes a version tag (vX.Y.Z) matching the
# version in pyproject.toml. Builds the Python distributions and the container
# image and publishes supply-chain evidence:
#   - a CycloneDX SBOM of the runtime dependencies (attached and attested);
#   - SLSA build provenance for the distributions and the image (GitHub
#     artifact attestations, signed with Sigstore; `gh attestation verify`);
#   - a cosign keyless signature on the image in GHCR (`cosign verify`).
# The GitHub release is created as a draft: a maintainer reviews and publishes.

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  dist:
    name: Distributions, SBOM and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing of the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: The tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - run: uv build

      - name: SBOM (CycloneDX) of the runtime dependencies
        run: |
          uv export --locked --no-dev --extra local --no-emit-project --no-hashes \
            --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from cyclonedx-bom==7.4.0 cyclonedx-py requirements "$RUNNER_TEMP/requirements.txt" \
            --output-format JSON --output-file dist/base-legal.cdx.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: dist/base-legal.cdx.json

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  image:
    name: Container image, signature and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tag from the version tag
        id: meta
        run: echo "tag=${IMAGE}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          provenance: false # SLSA provenance comes from the attestation below
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
